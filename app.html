                                    <div class="font-semibold">${item.avgSpend}</div>
                                </div>
                                <div>
                                    <div class="text-sm text-gray-500 mb-1">核心优势</div>
                                    <div class="font-semibold text-sm">${item.advantage}</div>
                                </div>
                            </div>
                        </div>
                    `).join('')}
                </div>
            `,
            
            social: () => `
                <h2 class="text-2xl font-bold mb-6">📈 社媒声量监测</h2>
                <div class="bg-white rounded-xl shadow-sm p-6">
                    <h3 class="text-lg font-semibold mb-4">品牌声量排名 TOP5</h3>
                    <div class="space-y-4">
                        ${DATA_SOURCE.social.brandRanking.map((item, index) => `
                            <div class="flex items-center space-x-4 p-4 bg-gray-50 rounded-lg">
                                <div class="w-8 h-8 ${index < 3 ? 'bg-yellow-500' : 'bg-gray-400'} rounded-full flex items-center justify-center text-white font-bold">
                                    ${item.rank}
                                </div>
                                <div class="flex-1">
                                    <div class="font-semibold">${item.brand}</div>
                                </div>
                                <div class="text-right">
                                    <div class="font-bold">${item.mentionIndex}</div>
                                    <div class="text-sm ${item.growth.startsWith('+') ? 'text-green-500' : 'text-red-500'}">${item.growth}</div>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `,
            
            marketing: () => `
                <h2 class="text-2xl font-bold mb-6">📢 营销案例库</h2>
                <div class="grid gap-6">
                    ${DATA_SOURCE.marketing.cases.map(item => `
                        <div class="bg-white p-6 rounded-xl shadow-sm card">
                            <div class="flex items-start space-x-4">
                                <div class="w-14 h-14 bg-gradient-to-br from-pink-500 to-orange-500 rounded-lg flex items-center justify-center text-white">
                                    <i class="fas fa-bullhorn text-xl"></i>
                                </div>
                                <div class="flex-1">
                                    <div class="flex items-center space-x-2 mb-1">
                                        <span class="px-2 py-1 bg-pink-100 text-pink-600 rounded text-sm">${item.brand}</span>
                                    </div>
                                    <h3 class="text-xl font-bold mb-2">${item.name}</h3>
                                    <p class="text-gray-600">${item.highlight}</p>
                                </div>
                            </div>
                        </div>
                    `).join('')}
                </div>
            `
        };

        // 路由控制
        const router = {
            current: 'overview',
            navigate(page) {
                this.current = page;
                document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
                document.querySelector(`a[href="#${page}"]`).classList.add('active');
                document.getElementById('content').innerHTML = render[page]();
                window.scrollTo(0, 0);
            }
        };

        // 初始化
        document.addEventListener('DOMContentLoaded', () => {
            // 导航点击
            document.querySelectorAll('.nav-item').forEach(link => {
                link.addEventListener('click', (e) => {
                    e.preventDefault();
                    const page = link.getAttribute('href').slice(1);
                    router.navigate(page);
                });
            });

            // 搜索功能
            document.getElementById('searchInput').addEventListener('input', (e) => {
                const keyword = e.target.value.toLowerCase();
                if (keyword.length > 0) {
                    // 搜索所有数据
                    const results = [];
                    DATA_SOURCE.news.forEach(item => {
                        if (item.title.toLowerCase().includes(keyword) || item.summary.toLowerCase().includes(keyword)) {
                            results.push({ type: '资讯', title: item.title });
                        }
                    });
                    DATA_SOURCE.bids.forEach(item => {
                        if (item.title.toLowerCase().includes(keyword)) {
                            results.push({ type: '标书', title: item.title });
                        }
                    });
                    
                    if (results.length > 0) {
                        document.getElementById('content').innerHTML = `
                            <h2 class="text-2xl font-bold mb-6">🔍 搜索结果</h2>
                            <div class="space-y-3">
                                ${results.slice(0, 10).map(r => `
                                    <div class="bg-white p-4 rounded-lg shadow-sm">
                                        <span class="px-2 py-1 bg-indigo-100 text-indigo-600 rounded text-sm mr-2">${r.type}</span>
                                        <span>${r.title}</span>
                                    </div>
                                `).join('')}
                            </div>
                        `;
                    }
                } else {
                    router.navigate(router.current);
                }
            });

            // 默认显示概览
            router.navigate('overview');
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>车讯通 - 汽车行业周报</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        header {
            text-align: center;
            color: white;
            padding: 40px 0;
        }
        
        header h1 {
            font-size: 48px;
            font-weight: 700;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }
        
        header p {
            font-size: 18px;
            opacity: 0.9;
        }
        
        .update-time {
            background: rgba(255,255,255,0.2);
            display: inline-block;
            padding: 8px 20px;
            border-radius: 20px;
            margin-top: 15px;
            font-size: 14px;
        }
        
        .actions {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin: 30px 0;
            flex-wrap: wrap;
        }
        
        .btn {
            padding: 12px 30px;
            border: none;
            border-radius: 25px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 500;
        }
        
        .btn-primary {
            background: #ff6b6b;
            color: white;
        }
        
        .btn-primary:hover {
            background: #ff5252;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255,107,107,0.4);
        }
        
        .btn-secondary {
            background: rgba(255,255,255,0.9);
            color: #667eea;
        }
        
        .btn-secondary:hover {
            background: white;
            transform: translateY(-2px);
        }
        
        .tabs {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }
        
        .tab {
            padding: 10px 25px;
            background: rgba(255,255,255,0.2);
            color: white;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 14px;
        }
        
        .tab:hover, .tab.active {
            background: white;
            color: #667eea;
        }
        
        .content-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 20px;
        }
        
        .news-card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            transition: transform 0.3s, box-shadow 0.3s;
            position: relative;
            overflow: hidden;
        }
        
        .news-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(0,0,0,0.15);
        }
        
        .news-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 5px;
            height: 100%;
        }
        
        .news-card.industry::before { background: #3498db; }
        .news-card.newcar::before { background: #e74c3c; }
        .news-card.company::before { background: #f39c12; }
        .news-card.tech::before { background: #9b59b6; }
        .news-card.market::before { background: #1abc9c; }
        
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 15px;
        }
        
        .category-tag {
            padding: 5px 12px;
            border-radius: 15px;
            font-size: 12px;
            font-weight: 500;
        }
        
        .category-tag.industry { background: #ebf5fb; color: #3498db; }
        .category-tag.newcar { background: #fdedec; color: #e74c3c; }
        .category-tag.company { background: #fef5e7; color: #f39c12; }
        .category-tag.tech { background: #f5eef8; color: #9b59b6; }
        .category-tag.market { background: #e8f8f5; color: #1abc9c; }
        
        .date {
            font-size: 12px;
            color: #95a5a6;
        }
        
        .news-title {
            font-size: 18px;
            font-weight: 600;
            color: #2c3e50;
            margin-bottom: 10px;
            line-height: 1.4;
        }
        
        .news-summary {
            font-size: 14px;
            color: #7f8c8d;
            line-height: 1.6;
            margin-bottom: 15px;
        }
        
        .news-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .source {
            font-size: 12px;
            color: #95a5a6;
        }
        
        .read-more {
            color: #667eea;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        
        .read-more:hover {
            color: #764ba2;
        }
        
        .loading {
            text-align: center;
            padding: 60px;
            color: white;
        }
        
        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(255,255,255,0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .empty-state {
            text-align: center;
            padding: 80px 20px;
            color: white;
        }
        
        .empty-state h3 {
            font-size: 24px;
            margin-bottom: 15px;
        }
        
        .empty-state p {
            opacity: 0.8;
            margin-bottom: 30px;
        }
        
        footer {
            text-align: center;
            padding: 40px;
            color: rgba(255,255,255,0.7);
            font-size: 14px;
        }
        
        .stats {
            display: flex;
            justify-content: center;
            gap: 40px;
            margin: 30px 0;
            flex-wrap: wrap;
        }
        
        .stat-item {
            text-align: center;
            color: white;
        }
        
        .stat-number {
            font-size: 36px;
            font-weight: 700;
        }
        
        .stat-label {
            font-size: 14px;
            opacity: 0.8;
        }
        
        @media (max-width: 768px) {
            header h1 {
                font-size: 32px;
            }
            
            .content-grid {
                grid-template-columns: 1fr;
            }
            
            .actions {
                flex-direction: column;
                align-items: center;
            }
            
            .btn {
                width: 200px;
            }
        }
    </style>
    <!-- PDF生成库 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.5.31/dist/jspdf.plugin.autotable.min.js"></script>
</head>
<body>
    <div class="container">
        <header>
            <h1>🚗 车讯通</h1>
            <p>汽车行业一周资讯精选</p>
            <div class="update-time">📅 数据更新于：<span id="updateTime">加载中...</span></div>
        </header>
        
        <div class="stats">
            <div class="stat-item">
                <div class="stat-number" id="totalNews">0</div>
                <div class="stat-label">本周资讯</div>
            </div>
            <div class="stat-item">
                <div class="stat-number" id="categoryCount">5</div>
                <div class="stat-label">覆盖领域</div>
            </div>
            <div class="stat-item">
                <div class="stat-number" id="sourceCount">0</div>
                <div class="stat-label">权威来源</div>
            </div>
        </div>
        
        <div class="actions">
            <button class="btn btn-primary" onclick="refreshData()">🔄 刷新数据</button>
            <button class="btn btn-secondary" onclick="generateReport()">📄 生成周报</button>
            <button class="btn btn-secondary" onclick="viewHistory()">📚 历史记录</button>
        </div>
        
        <!-- 搜索框 -->
        <div class="search-box" style="margin: 20px 0; text-align: center;">
            <input type="text" id="searchInput" placeholder="🔍 搜索资讯标题、内容、来源..." 
                   style="width: 60%; max-width: 500px; padding: 12px 20px; border: 2px solid rgba(255,255,255,0.3); 
                          border-radius: 25px; font-size: 16px; background: rgba(255,255,255,0.9); 
                          outline: none; transition: all 0.3s;"
                   onkeyup="handleSearch(event)">
            <button onclick="performSearch()" 
                    style="margin-left: 10px; padding: 12px 25px; border: none; border-radius: 25px; 
                           background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; 
                           font-size: 16px; cursor: pointer; transition: all 0.3s;">
                搜索
            </button>
            <button onclick="clearSearch()" 
                    style="margin-left: 10px; padding: 12px 20px; border: none; border-radius: 25px; 
                           background: rgba(255,255,255,0.3); color: white; font-size: 16px; 
                           cursor: pointer; transition: all 0.3s;">
                清空
            </button>
        </div>
        
        <div class="tabs">
            <div class="tab active" onclick="filterCategory('all')">全部</div>
            <div class="tab" onclick="filterCategory('car')">🚗 汽车</div>
            <div class="tab" onclick="filterCategory('industry')">🏛️ 行业动态</div>
            <div class="tab" onclick="filterCategory('newcar')">🚘 新车发布</div>
            <div class="tab" onclick="filterCategory('company')">🏢 企业新闻</div>
            <div class="tab" onclick="filterCategory('tech')">🔬 技术趋势</div>
            <div class="tab" onclick="filterCategory('market')">📊 市场热点</div>
        </div>
        
        <div id="contentArea">
            <div class="loading">
                <div class="loading-spinner"></div>
                <p>正在加载最新汽车资讯...</p>
            </div>
        </div>
        
        <footer>
            <p>车讯通 · 每周一自动更新 · 数据来源：汽车之家/易车/懂车帝/盖世汽车等权威平台</p>
            <p>© 2026 车讯通 Automotive Weekly Report</p>
        </footer>
    </div>
    
    <script src="data.js"></script>
    <script>
        // 使用真实数据源

        
        let currentData = [];
        let currentFilter = 'all';
        
        function init() {
            updateTime();
            loadData();
        }
        
        function updateTime() {
            const now = new Date();
            const timeStr = now.toLocaleString('zh-CN', {
                year: 'numeric',
                month: '2-digit',
                day: '2-digit',
                hour: '2-digit',
                minute: '2-digit'
            });
            document.getElementById('updateTime').textContent = timeStr;
        }
        
        function loadData() {
            // 使用真实数据源
            setTimeout(() => {
                currentData = DATA_SOURCE.news;
                renderNews(currentData);
                updateStats();
                document.getElementById('updateTime').textContent = DATA_SOURCE.lastUpdate + ' 09:00';
            }, 800);
        }
        
        function renderNews(data) {
            const contentArea = document.getElementById('contentArea');
            
            if (data.length === 0) {
                contentArea.innerHTML = `
                    <div class="empty-state">
                        <h3>暂无数据</h3>
                        <p>本周该类别的资讯正在收集中，请稍后再试</p>
                        <button class="btn btn-primary" onclick="refreshData()">刷新数据</button>
                    </div>
                `;
                return;
            }
            
            const html = `
                <div class="content-grid">
                    ${data.map(item => `
                        <div class="news-card ${item.category}">
                            <div class="card-header">
                                <span class="category-tag ${item.category}">${item.categoryName}</span>
                                <span class="date">${item.date}</span>
                            </div>
                            <h3 class="news-title">${item.title}</h3>
                            <p class="news-summary">${item.summary}</p>
                            <div class="news-footer">
                                <span class="source">来源：${item.source}</span>
                                <a href="${item.url}" target="_blank" class="read-more">
                                    查看原文 →
                                </a>
                            </div>
                        </div>
                    `).join('')}
                </div>
            `;
            
            contentArea.innerHTML = html;
        }
        
        function updateStats() {
            document.getElementById('totalNews').textContent = currentData.length;
            const sources = new Set(currentData.map(item => item.source));
            document.getElementById('sourceCount').textContent = sources.size;
        }
        
        function filterCategory(category) {
            currentFilter = category;
            
            // 更新tab样式
            document.querySelectorAll('.tab').forEach(tab => {
                tab.classList.remove('active');
            });
            event.target.classList.add('active');
            
            // 筛选数据
            if (category === 'all') {
                renderNews(currentData);
            } else {
                const filtered = currentData.filter(item => item.category === category);
                renderNews(filtered);
            }
        }
        
        function refreshData() {
            const contentArea = document.getElementById('contentArea');
            contentArea.innerHTML = `
                <div class="loading">
                    <div class="loading-spinner"></div>
                    <p>正在刷新数据...</p>
                </div>
            `;
            
            // 模拟刷新
            setTimeout(() => {
                updateTime();
                loadData();
            }, 2000);
        }
        
        function generateReport() {
            // 确保显示全部资讯
            if (currentFilter !== 'all') {
                currentFilter = 'all';
                renderNews(DATA_SOURCE.news);
                // 更新tab样式
                document.querySelectorAll('.tab').forEach(tab => tab.classList.remove('active'));
                document.querySelectorAll('.tab')[0].classList.add('active');
            }
            
            alert('请按 Ctrl+P (Windows) 或 Cmd+P (Mac) 打印为PDF\n\n提示：选择「目标打印机」→「另存为PDF」');
        }
        
        function viewHistory() {
            alert('历史记录功能开发中...\n（此功能需要接入后端API）');
        }
        
        // ========== 搜索功能 ==========
        function handleSearch(event) {
            if (event.key === 'Enter') {
                performSearch();
            }
        }
        
        function performSearch() {
            const keyword = document.getElementById('searchInput').value.trim().toLowerCase();
            if (!keyword) {
                renderNews(currentData);
                return;
            }
            
            const filtered = currentData.filter(item => {
                return item.title.toLowerCase().includes(keyword) ||
                       item.summary.toLowerCase().includes(keyword) ||
                       item.source.toLowerCase().includes(keyword) ||
                       item.categoryName.toLowerCase().includes(keyword);
            });
            
            renderNews(filtered);
            
            // 显示搜索结果提示
            const contentArea = document.getElementById('contentArea');
            const resultTip = document.createElement('div');
            resultTip.id = 'search-result-tip';
            resultTip.innerHTML = `
                <div style="background: rgba(102, 126, 234, 0.1); border-left: 4px solid #667eea; 
                            padding: 15px 20px; margin-bottom: 20px; border-radius: 8px;">
                    <strong>🔍 搜索结果：</strong>找到 ${filtered.length} 条包含 "${keyword}" 的资讯
                    <button onclick="clearSearch()" style="margin-left: 15px; padding: 5px 15px; 
                            border: none; border-radius: 15px; background: #667eea; color: white; 
                            cursor: pointer; font-size: 14px;">清空搜索</button>
                </div>
            `;
            contentArea.insertBefore(resultTip, contentArea.firstChild);
        }
        
        function clearSearch() {
            document.getElementById('searchInput').value = '';
            renderNews(currentData);
            currentFilter = 'all';
            // 重置tab样式
            document.querySelectorAll('.tab').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.tab')[0].classList.add('active');
        }
        
        // 页面加载时初始化
        window.onload = init;
    </script>
</body>
</html>

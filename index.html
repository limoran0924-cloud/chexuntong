<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>车讯通 - 汽车行业周报</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        header {
            text-align: center;
            color: white;
            padding: 40px 0;
        }
        
        header h1 {
            font-size: 48px;
            font-weight: 700;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }
        
        header p {
            font-size: 18px;
            opacity: 0.9;
        }
        
        .update-time {
            background: rgba(255,255,255,0.2);
            display: inline-block;
            padding: 8px 20px;
            border-radius: 20px;
            margin-top: 15px;
            font-size: 14px;
        }
        
        .actions {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin: 30px 0;
            flex-wrap: wrap;
        }
        
        .btn {
            padding: 12px 30px;
            border: none;
            border-radius: 25px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 500;
        }
        
        .btn-primary {
            background: #ff6b6b;
            color: white;
        }
        
        .btn-primary:hover {
            background: #ff5252;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255,107,107,0.4);
        }
        
        .btn-secondary {
            background: rgba(255,255,255,0.9);
            color: #667eea;
        }
        
        .btn-secondary:hover {
            background: white;
            transform: translateY(-2px);
        }
        
        /* 搜索框样式 */
        .search-container {
            max-width: 600px;
            margin: 20px auto 30px;
            display: flex;
            gap: 10px;
        }
        
        .search-input {
            flex: 1;
            padding: 12px 20px;
            border: none;
            border-radius: 25px;
            font-size: 14px;
            outline: none;
        }
        
        .search-btn {
            padding: 12px 25px;
            background: rgba(255,255,255,0.9);
            color: #667eea;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.3s;
        }
        
        .search-btn:hover {
            background: white;
            transform: translateY(-2px);
        }
        
        .tabs {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }
        
        .tab {
            padding: 10px 25px;
            background: rgba(255,255,255,0.2);
            color: white;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 14px;
        }
        
        .tab:hover, .tab.active {
            background: white;
            color: #667eea;
        }
        
        .content-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 20px;
        }
        
        .news-card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            transition: transform 0.3s, box-shadow 0.3s;
            position: relative;
            overflow: hidden;
        }
        
        .news-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(0,0,0,0.15);
        }
        
        .news-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 5px;
            height: 100%;
        }
        
        .news-card.industry::before { background: #3498db; }
        .news-card.newcar::before { background: #e74c3c; }
        .news-card.company::before { background: #f39c12; }
        .news-card.tech::before { background: #9b59b6; }
        .news-card.market::before { background: #1abc9c; }
        .news-card.report::before { background: #764ba2; }
        .news-card.bids::before { background: #e67e22; }
        
        .category-tag.bids { background: #fef3e2; color: #e67e22; }
        .category-tag.bids-advertising { background: #e8f5e9; color: #27ae60; }
        .category-tag.bids-event { background: #fff3e0; color: #f39c12; }
        .category-tag.bids-content { background: #e3f2fd; color: #1976d2; }
        .category-tag.bids-digital { background: #f3e5f5; color: #7b1fa2; }
        .category-tag.bids-material { background: #fce4ec; color: #c2185b; }
        
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 15px;
        }
        
        .category-tag {
            padding: 5px 12px;
            border-radius: 15px;
            font-size: 12px;
            font-weight: 500;
        }
        
        .category-tag.industry { background: #ebf5fb; color: #3498db; }
        .category-tag.newcar { background: #fdedec; color: #e74c3c; }
        .category-tag.company { background: #fef5e7; color: #f39c12; }
        .category-tag.tech { background: #f5eef8; color: #9b59b6; }
        .category-tag.market { background: #e8f8f5; color: #1abc9c; }
        .category-tag.report { background: #f0e6f7; color: #764ba2; }
        
        .date {
            font-size: 12px;
            color: #95a5a6;
        }
        
        .news-title {
            font-size: 18px;
            font-weight: 600;
            color: #2c3e50;
            margin-bottom: 10px;
            line-height: 1.4;
        }
        
        .news-summary {
            font-size: 14px;
            color: #7f8c8d;
            line-height: 1.6;
            margin-bottom: 15px;
        }
        
        .news-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .source {
            font-size: 12px;
            color: #95a5a6;
        }
        
        .read-more {
            color: #667eea;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        
        .read-more:hover {
            color: #764ba2;
        }
        
        .loading {
            text-align: center;
            padding: 60px;
            color: white;
        }
        
        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(255,255,255,0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .empty-state {
            text-align: center;
            padding: 80px 20px;
            color: white;
        }
        
        .empty-state h3 {
            font-size: 24px;
            margin-bottom: 15px;
        }
        
        .empty-state p {
            opacity: 0.8;
            margin-bottom: 30px;
        }
        
        footer {
            text-align: center;
            padding: 40px;
            color: rgba(255,255,255,0.7);
            font-size: 14px;
        }
        
        .stats {
            display: flex;
            justify-content: center;
            gap: 40px;
            margin: 30px 0;
            flex-wrap: wrap;
        }
        
        .stat-item {
            text-align: center;
            color: white;
        }
        
        .stat-number {
            font-size: 36px;
            font-weight: 700;
        }
        
        .stat-label {
            font-size: 14px;
            opacity: 0.8;
        }
        
        /* 搜索结果高亮 */
        .highlight {
            background: yellow;
            color: #333;
            padding: 0 2px;
        }
        
        @media (max-width: 768px) {
            header h1 {
                font-size: 32px;
            }
            
            .content-grid {
                grid-template-columns: 1fr;
            }
            
            .actions {
                flex-direction: column;
                align-items: center;
            }
            
            .btn {
                width: 200px;
            }
            
            .search-container {
                flex-direction: column;
            }
        }
    </style>
    <!-- PDF生成库 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.5.31/dist/jspdf.plugin.autotable.min.js"></script>
</head>
<body>
    <div class="container">
        <header>
            <h1>🚗 车讯通</h1>
            <p>汽车行业一周资讯精选</p>
            <div class="update-time">📅 数据更新于：<span id="updateTime">加载中...</span></div>
        </header>
        
        <div class="stats">
            <div class="stat-item">
                <div class="stat-number" id="totalNews">0</div>
                <div class="stat-label">本周资讯</div>
            </div>
            <div class="stat-item">
                <div class="stat-number" id="categoryCount">5</div>
                <div class="stat-label">覆盖领域</div>
            </div>
            <div class="stat-item">
                <div class="stat-number" id="sourceCount">0</div>
                <div class="stat-label">权威来源</div>
            </div>
        </div>
        
        <!-- 搜索框 -->
        <div class="search-container">
            <input type="text" class="search-input" id="searchInput" placeholder="搜索资讯、报告、KOL...">
            <button class="search-btn" onclick="performSearch()">🔍 搜索</button>
        </div>
        
        <div class="actions">
            <button class="btn btn-primary" onclick="refreshData()">🔄 刷新数据</button>
            <button class="btn btn-secondary" onclick="generateReport()">📄 生成周报</button>
            <button class="btn btn-secondary" onclick="viewHistory()">📚 历史记录</button>
        </div>
        
        <div class="tabs">
            <div class="tab active" onclick="filterCategory('all')">全部</div>
            <div class="tab" onclick="filterCategory('brand')">🚗 汽车品牌</div>
            <div class="tab" onclick="filterCategory('industry')">🏛️ 行业动态</div>
            <div class="tab" onclick="filterCategory('newcar')">🚘 新车发布</div>
            <div class="tab" onclick="filterCategory('company')">🏢 企业新闻</div>
            <div class="tab" onclick="filterCategory('tech')">🔬 技术趋势</div>
            <div class="tab" onclick="filterCategory('market')">📊 市场热点</div>
            <div class="tab" onclick="filterCategory('report')">📑 行业报告</div>
            <div class="tab" onclick="filterCategory('insurance')">🛡️ 保险行业</div>
            <div class="tab" onclick="filterCategory('bids')">📋 标书商机</div>
            <div class="tab" onclick="showGlossary()">📚 词条百科</div>
        </div>
        
        <div id="contentArea">
            <div class="loading">
                <div class="loading-spinner"></div>
                <p>正在加载最新汽车资讯...</p>
            </div>
        </div>
        
        <footer>
            <p>车讯通 · 每周一自动更新 · 数据来源：汽车之家/易车/懂车帝/盖世汽车等权威平台</p>
            <p>标书来源：海尔/零跑/奇瑞/东风等主机厂招标平台</p>
            <p>© 2026 车讯通 Automotive Weekly Report v2.2</p>
        </footer>
    </div>
    
    <script src="data.js"></script>
    <script>
        let currentData = [];
        let currentFilter = 'all';
        let currentGlossaryView = 'card'; // 'list' 或 'card'
        let currentGlossaryFilter = 'all';
        
        function init() {
            updateTime();
            loadData();
        }
        
        function updateTime() {
            const now = new Date();
            const timeStr = now.toLocaleString('zh-CN', {
                year: 'numeric',
                month: '2-digit',
                day: '2-digit',
                hour: '2-digit',
                minute: '2-digit'
            });
            document.getElementById('updateTime').textContent = timeStr;
        }
        
        function loadData() {
            setTimeout(() => {
                // 合并新闻和行业报告
                let allData = [...DATA_SOURCE.news];
                
                // 添加行业报告数据
                if (DATA_SOURCE.industryReports) {
                    DATA_SOURCE.industryReports.forEach(report => {
                        allData.push({
                            id: report.id,
                            category: 'report',
                            categoryName: '行业报告',
                            title: report.title,
                            summary: report.summary,
                            date: report.publishDate,
                            source: report.institution,
                            url: report.url,
                            isReport: true,
                            communications: report.communications
                        });
                    });
                }
                
                currentData = allData;
                renderNews(currentData);
                updateStats();
                document.getElementById('updateTime').textContent = DATA_SOURCE.lastUpdate + ' 09:00';
            }, 800);
        }
        
        // 加载保险行业数据（完整传播动作）
        function loadInsuranceData() {
            const contentArea = document.getElementById('contentArea');
            
            if (!DATA_SOURCE.industryReports || DATA_SOURCE.industryReports.length === 0) {
                contentArea.innerHTML = `
                    <div class="empty-state">
                        <h3>暂无保险行业数据</h3>
                    </div>
                `;
                return;
            }
            
            const report = DATA_SOURCE.industryReports[0];
            const html = renderInsuranceCard(report);
            contentArea.innerHTML = html;
        }
        
        // 渲染保险行业完整卡片
        function renderInsuranceCard(report) {
            const comm = report.communications;
            return `
                <div style="max-width: 1000px; margin: 0 auto;">
                    <!-- 白皮书基本信息 -->
                    <div class="news-card report" style="margin-bottom: 20px;">
                        <div class="card-header">
                            <span class="category-tag report">保险行业</span>
                            <span class="date">${report.publishDate}</span>
                        </div>
                        <h3 class="news-title" style="font-size: 22px; margin-bottom: 15px;">${report.title}</h3>
                        <p class="news-summary" style="font-size: 15px; line-height: 1.8;">${report.summary}</p>
                        <div style="margin-top: 15px; padding: 15px; background: #f8f9fa; border-radius: 8px;">
                            <div style="font-weight: 600; color: #764ba2; margin-bottom: 10px;">核心发现</div>
                            <ul style="margin-left: 20px; color: #555; line-height: 2;">
                                ${report.keyFindings.map(finding => `<li>${finding}</li>`).join('')}
                            </ul>
                        </div>
                        <div class="news-footer" style="margin-top: 15px;">
                            <span class="source">来源：${report.institution}</span>
                            <a href="${report.url}" target="_blank" class="read-more">查看白皮书原文 →</a>
                        </div>
                    </div>
                    
                    <!-- 内容传播动作全景 -->
                    <div style="background: white; border-radius: 15px; padding: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); margin-bottom: 20px;">
                        <h2 style="color: #764ba2; margin-bottom: 25px; font-size: 20px; border-left: 4px solid #764ba2; padding-left: 15px;">
                            📢 内容传播动作全景
                        </h2>
                        
                        <!-- 1. 官方发布 -->
                        <div style="margin-bottom: 25px; padding: 20px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); border-radius: 12px; color: white;">
                            <h3 style="margin-bottom: 15px; font-size: 16px;">🎯 官方发布</h3>
                            <div style="line-height: 2;">
                                <div><strong>发布时间：</strong>${comm.official.launchEvent.date}</div>
                                <div><strong>发布地点：</strong>${comm.official.launchEvent.location}</div>
                                <div><strong>发布机构：</strong>${comm.official.launchEvent.description}</div>
                                <div style="margin-top: 10px;">
                                    <strong>官方链接：</strong>
                                    <a href="${comm.official.launchEvent.url}" target="_blank" style="color: #fff; text-decoration: underline;">清华大学官网发布页面</a>
                                </div>
                            </div>
                        </div>
                        
                        <!-- 2. 媒体报道 -->
                        <div style="margin-bottom: 25px;">
                            <h3 style="color: #333; margin-bottom: 15px; font-size: 16px;">📰 媒体报道（${comm.mediaCoverage.length}家）</h3>
                            <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 15px;">
                                ${comm.mediaCoverage.map(media => `
                                    <div style="padding: 15px; background: #f8f9fa; border-radius: 8px; border-left: 3px solid #3498db;">
                                        <div style="font-size: 12px; color: #666; margin-bottom: 5px;">${media.type} · ${media.date}</div>
                                        <div style="font-weight: 500; color: #333; margin-bottom: 8px; line-height: 1.4;">${media.outlet}</div>
                                        <a href="${media.url}" target="_blank" style="color: #667eea; font-size: 13px; text-decoration: none;">查看报道 →</a>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                        
                        <!-- 3. 学术传播 -->
                        <div style="margin-bottom: 25px; padding: 20px; background: #f0f7ff; border-radius: 12px;">
                            <h3 style="color: #333; margin-bottom: 15px; font-size: 16px;">🎓 学术传播</h3>
                            <div style="line-height: 2; color: #555;">
                                <div><strong>研究中心：</strong>${comm.academic.researchCenter}</div>
                                <div><strong>首席研究员：</strong>${comm.academic.leadResearcher}</div>
                                <div><strong>研究方法：</strong>${comm.academic.researchMethodology}</div>
                                <div><strong>学术合作：</strong>${comm.academic.academicPartners.join('、')}</div>
                            </div>
                        </div>
                        
                        <!-- 4. 高管发声 -->
                        <div style="margin-bottom: 25px;">
                            <h3 style="color: #333; margin-bottom: 15px; font-size: 16px;">🎤 高管发声</h3>
                            <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(400px, 1fr)); gap: 15px;">
                                ${comm.corporateCommunications.executiveStatements.map(exec => `
                                    <div style="padding: 20px; background: #fef5e7; border-radius: 12px; border-left: 3px solid #f39c12;">
                                        <div style="font-weight: 600; color: #333; margin-bottom: 10px;">${exec.speaker}</div>
                                        <div style="color: #666; line-height: 1.6; margin-bottom: 10px;">${exec.keyMessage}</div>
                                        ${exec.quote ? `<div style="font-style: italic; color: #999; font-size: 13px;">"${exec.quote}"</div>` : ''}
                                        ${exec.highlights ? `
                                            <div style="margin-top: 10px; padding-top: 10px; border-top: 1px dashed #ddd;">
                                                <div style="font-size: 12px; color: #666; margin-bottom: 5px;">核心要点：</div>
                                                <ul style="margin-left: 15px; font-size: 13px; color: #555; line-height: 1.8;">
                                                    ${exec.highlights.map(h => `<li>${h}</li>`).join('')}
                                                </ul>
                                            </div>
                                        ` : ''}
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                        
                        <!-- 5. 社媒传播 -->
                        <div style="margin-bottom: 25px; padding: 20px; background: #f5eef8; border-radius: 12px;">
                            <h3 style="color: #333; margin-bottom: 15px; font-size: 16px;">📱 社媒传播</h3>
                            <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 15px;">
                                <div style="padding: 15px; background: white; border-radius: 8px;">
                                    <div style="font-weight: 600; color: #07c160; margin-bottom: 8px;">微信公众号</div>
                                    <div style="font-size: 13px; color: #666; line-height: 1.6;">
                                        ${comm.socialMedia.wechat.officialAccounts.join('、')}
                                        <br><span style="color: #999;">${comm.socialMedia.wechat.contentType}</span>
                                    </div>
                                </div>
                                <div style="padding: 15px; background: white; border-radius: 8px;">
                                    <div style="font-weight: 600; color: #e6162d; margin-bottom: 8px;">微博话题</div>
                                    <div style="font-size: 13px; color: #666; line-height: 1.6;">
                                        ${comm.socialMedia.weibo.topics.join('、')}
                                        <br><span style="color: #999;">KOL: ${comm.socialMedia.weibo.kols.join('、')}</span>
                                    </div>
                                </div>
                                <div style="padding: 15px; background: white; border-radius: 8px;">
                                    <div style="font-weight: 600; color: #ff6b6b; margin-bottom: 8px;">视频号</div>
                                    <div style="font-size: 13px; color: #666; line-height: 1.6;">
                                        ${comm.socialMedia.videoPlatforms.channels.join('、')}
                                        <br><span style="color: #999;">${comm.socialMedia.videoPlatforms.contentType}</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                        
                        <!-- 6. 产品整合 -->
                        <div style="padding: 20px; background: linear-gradient(135deg, #1abc9c 0%, #16a085 100%); border-radius: 12px; color: white;">
                            <h3 style="margin-bottom: 15px; font-size: 16px;">💼 产品整合</h3>
                            <div style="line-height: 2;">
                                <div><strong>产品名称：</strong>${comm.corporateCommunications.productIntegration.program}</div>
                                <div><strong>发布时间：</strong>${comm.corporateCommunications.productIntegration.launchDate}</div>
                                <div><strong>核心功能：</strong>${comm.corporateCommunications.productIntegration.features.join('、')}</div>
                                <div><strong>战略投入：</strong>${comm.corporateCommunications.productIntegration.investment}</div>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }
        
        function renderNews(data) {
            const contentArea = document.getElementById('contentArea');
            
            if (data.length === 0) {
                contentArea.innerHTML = `
                    <div class="empty-state">
                        <h3>暂无数据</h3>
                        <p>本周该类别的资讯正在收集中，请稍后再试</p>
                        <button class="btn btn-primary" onclick="refreshData()">刷新数据</button>
                    </div>
                `;
                return;
            }
            
            const html = `
                <div class="content-grid">
                    ${data.map(item => {
                        // 如果是行业报告，显示传播动作
                        if (item.isReport && item.communications) {
                            return renderReportCard(item);
                        }
                        return `
                            <div class="news-card ${item.category}">
                                <div class="card-header">

        // 搜索功能
        function performSearch() {
            const keyword = document.getElementById('searchInput').value.trim();
            if (!keyword) {
                // 清空搜索，显示全部
                renderNews(currentData);
                // 重置tab
                document.querySelectorAll('.tab').forEach(tab => tab.classList.remove('active'));
                document.querySelector('.tab').classList.add('active');
                return;
            }
            
            // 使用SearchUtils搜索
            if (typeof SearchUtils !== 'undefined') {
                const results = SearchUtils.search(keyword);
                if (results.length > 0) {
                    // 转换为统一格式
                    const formattedResults = results.map(item => ({
                        id: item.id || Date.now() + Math.random(),
                        category: item.type === 'report' ? 'report' : item.category,
                        categoryName: item.type === 'report' ? '行业报告' : item.categoryName,
                        title: item.title || item.name,
                        summary: item.summary || item.description || '',
                        date: item.date || item.publishDate || DATA_SOURCE.lastUpdate,
                        source: item.source || item.institution || '搜索',
                        url: item.url || '#'
                    }));
                    renderNews(formattedResults);
                } else {
                    document.getElementById('contentArea').innerHTML = `
                        <div class="empty-state">
                            <h3>未找到相关内容</h3>
                            <p>请尝试其他关键词</p>
                        </div>
                    `;
                }
            } else {
                // 简单搜索
                const lowerKeyword = keyword.toLowerCase();
                const filtered = currentData.filter(item => 
                    (item.title && item.title.toLowerCase().includes(lowerKeyword)) ||
                    (item.summary && item.summary.toLowerCase().includes(lowerKeyword)) ||
                    (item.source && item.source.toLowerCase().includes(lowerKeyword))
                );
                renderNews(filtered);
            }
        }

        // 渲染词条列表 - 支持列表视图和卡片网格视图
        function renderGlossaryTerms(terms, viewType = 'card') {
            if (terms.length === 0) {
                return '<div class="empty-state"><h3>暂无词条</h3></div>';
            }
            
            const categoryNames = {
                'brand': '🚗 汽车品牌',
                'industry': '🏛️ 行业动态',
                'newcar': '🚘 新车发布',
                'company': '🏢 企业新闻',
                'tech': '🔬 技术趋势',
                'market': '📊 市场热点',
                'report': '📑 行业报告',
                'insurance': '🛡️ 保险行业'
            };
            
            const categoryColors = {
                'brand': '#ff6b6b',
                'industry': '#4ecdc4',
                'newcar': '#45b7d1',
                'company': '#96ceb4',
                'tech': '#74b9ff',
                'market': '#fdcb6e',
                'report': '#a29bfe',
                'insurance': '#fd79a8'
            };
            
            if (viewType === 'tagcloud') {
                // 标签云视图 - 关键词大小不一、像云朵一样散落排列
                const categoryColors = {
                    'brand': ['#ff6b6b', '#ff8e8e'],
                    'industry': ['#4ecdc4', '#6ee7df'],
                    'newcar': ['#45b7d1', '#74c7e3'],
                    'company': ['#96ceb4', '#b8e6c1'],
                    'tech': ['#74b9ff', '#a8d8ff'],
                    'market': ['#fdcb6e', '#ffe082'],
                    'report': ['#a29bfe', '#c4b5fd'],
                    'insurance': ['#fd79a8', '#ff9ebf']
                };
                
                // 根据词条内容重要性计算大小级别
                const getSizeLevel = (term) => {
                    const hasUsage = term.usage ? 1 : 0;
                    const hasAliases = term.aliases && term.aliases.length > 0 ? 1 : 0;
                    const hasRelated = term.relatedTerms && term.relatedTerms.length > 0 ? 1 : 0;
                    const definitionLength = term.definition ? term.definition.length : 0;
                    
                    const score = hasUsage + hasAliases + hasRelated + Math.floor(definitionLength / 100);
                    
                    if (score >= 5) return 'xlarge';
                    if (score >= 3) return 'large';
                    if (score >= 2) return 'medium';
                    return 'small';
                };
                
                const sizeStyles = {
                    'xlarge': { fontSize: '28px', padding: '16px 28px', opacity: 1 },
                    'large': { fontSize: '22px', padding: '12px 22px', opacity: 0.95 },
                    'medium': { fontSize: '17px', padding: '10px 18px', opacity: 0.9 },
                    'small': { fontSize: '13px', padding: '8px 14px', opacity: 0.85 }
                };
                
                return `
                    <div class="tag-cloud-container" style="padding: 30px 20px; text-align: center; min-height: 500px; position: relative;">
                        <div class="tag-cloud" style="display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 15px; line-height: 2.5;">
                            ${terms.map((term, index) => {
                                const sizeLevel = getSizeLevel(term);
                                const style = sizeStyles[sizeLevel];
                                const colors = categoryColors[term.category] || ['#667eea', '#764ba2'];
                                const rotation = (Math.random() - 0.5) * 10; // -5到5度随机旋转
                                
                                return `
                                    <span onclick="showTermDetail('${term.id}')" 
                                          style="display: inline-block; 
                                                 background: linear-gradient(135deg, ${colors[0]} 0%, ${colors[1]} 100%); 
                                                 color: white; 
                                                 font-size: ${style.fontSize}; 
                                                 padding: ${style.padding}; 
                                                 border-radius: 50px; 
                                                 cursor: pointer; 
                                                 transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
                                                 box-shadow: 0 4px 15px rgba(0,0,0,0.15);
                                                 transform: rotate(${rotation}deg);
                                                 opacity: ${style.opacity};
                                                 font-weight: 500;
                                                 white-space: nowrap;
                                                 animation: tagFloat ${2.5 + Math.random() * 2}s ease-in-out infinite;
                                                 animation-delay: ${index * 0.08}s;"
                                          onmouseover="this.style.transform='rotate(0deg) scale(1.15) translateY(-5px)'; this.style.boxShadow='0 8px 30px rgba(0,0,0,0.3)'; this.style.zIndex='10'; this.style.opacity='1';"
                                          onmouseout="this.style.transform='rotate(${rotation}deg) scale(1) translateY(0)'; this.style.boxShadow='0 4px 15px rgba(0,0,0,0.15)'; this.style.zIndex='1'; this.style.opacity='${style.opacity}';"
                                          title="${term.definition.substring(0, 50)}...">
                                        ${term.icon || ''} ${term.term}
                                    </span>
                                `;
                            }).join('')}
                        </div>
                        <style>
                            @keyframes tagFloat {
                                0%, 100% { transform: translateY(0px) rotate(var(--rotation, 0deg)); }
                                50% { transform: translateY(-8px) rotate(var(--rotation, 0deg)); }
                            }
                        </style>
                    </div>
                    <div style="text-align: center; margin-top: 20px; color: #999; font-size: 13px;">
                        💡 词条大小表示内容丰富程度，点击任意词条查看详情
                    </div>
                `;
            } else if (viewType === 'cloud') {
                // 词云视图 - 圆形/椭圆形泡泡排列

            // 为每个品牌定义独特的关键词（模拟真实品牌关键词数据）

            // 按内容量（重要性）排序并分配字号

            let html = `

                    <div style="padding: 60px 40px; background: white;">
                        <h3 style="font-size: 14px; color: #94a3b8; margin: 0 0 40px 0; text-transform: uppercase; letter-spacing: 2px; font-weight: 500;">关键词偏好 · 指标：内容量</h3>
                        
                        <div class="keyword-cloud" style="background: #ffffff; padding: 60px 50px; max-width: 720px; margin: 0 auto; min-height: 420px; position: relative; overflow: visible;">
                            ${(() => {
                                const brandKeywords = getBrandKeywords(brandTerm.term);
                                const sorted = brandKeywords.sort((a, b) => b.weight - a.weight);
                                
                                const placed = [];
                                const centerX = 50, centerY = 50;
                                const goldenAngle = Math.PI * (3 - Math.sqrt(5));
                                
                                sorted.forEach((kw, index) => {
                                    const fontSize = kw.weight >= 5 ? 26 : kw.weight >= 4 ? 22 : kw.weight >= 3 ? 18 : kw.weight >= 2 ? 14 : 11;
                                    const wordRadius = fontSize * 0.4;
                                    
                                    let x, y;
                                    let attempts = 0;
                                    
                                    // 黄金螺旋 + 防重叠
                                    while (attempts < 80) {
                                        const angle = index * goldenAngle + attempts * 0.04;
                                        // 递增距离：小间隔开始，逐渐加大
                                        const distance = index === 0 ? 0 : 9 + (index * 4.5) + (attempts * 0.7);
                                        
                                        x = centerX + Math.cos(angle) * distance * 0.58;
                                        y = centerY + Math.sin(angle) * distance * 0.38;
                                        
                                        // 边界检查
                                        if (x < 20 || x > 80 || y < 18 || y > 82) {
                                            attempts++;
                                            continue;
                                        }
                                        
                                        // 防重叠检查
                                        let tooClose = false;
                                        for (let p of placed) {
                                            const dx = (x - p.x) * 0.58;
                                            const dy = (y - p.y) * 0.38;
                                            const dist = Math.sqrt(dx*dx + dy*dy);
                                            if (dist < wordRadius + p.wordRadius + 2.5) {
                                                tooClose = true;
                                                break;
                                            }
                                        }
                                        
                                        if (!tooClose) break;
                                        attempts++;
                                    }
                                    
                                    x = Math.max(20, Math.min(80, x));
                                    y = Math.max(18, Math.min(82, y));
                                    placed.push({x, y, kw, fontSize, wordRadius});
                                });
                                
                                return placed.map(p => {

                        </p>
                    </div>
                </div>
            `;
            
            contentArea.innerHTML = html;

                    { text: '雷军', weight: 5 }, { text: 'SU7', weight: 5 },
                    { text: '人车家', weight: 5 }, { text: '性价比', weight: 4 },
                    { text: '生态', weight: 4 }, { text: '智能', weight: 4 },
                    { text: '年轻', weight: 4 }, { text: '科技', weight: 3 },
                    { text: '澎湃OS', weight: 3 }, { text: '好看', weight: 3 },
                    { text: '好开', weight: 3 }, { text: 'SU7 Ultra', weight: 3 },
                    { text: '运动', weight: 2 }, { text: '性能', weight: 2 },
                    { text: '颜值', weight: 2 }, { text: '轿跑', weight: 2 },
                    { text: '加速', weight: 2 }, { text: '智能', weight: 2 },
                    { text: '潮流', weight: 1 }, { text: '粉丝', weight: 1 },
                    { text: '国民', weight: 1 }, { text: '爆款', weight: 1 }
                ]
            };
            
            // 如果品牌有预设关键词，使用预设；否则生成通用关键词
            if (keywordDatabase[brandName]) {
                return keywordDatabase[brandName];
            }
            
            // 通用品牌关键词
            return [
                { text: brandName, weight: 5 },
                { text: '新能源汽车', weight: 4 },
                { text: '智能', weight: 4 },
                { text: '科技', weight: 3 },
                { text: '舒适', weight: 3 },
                { text: '安全', weight: 3 },
                { text: '品质', weight: 2 },
                { text: '创新', weight: 2 },
                { text: '家用', weight: 2 },
                { text: '豪华', weight: 2 },
                { text: '续航', weight: 2 },
                { text: '快充', weight: 2 },
                { text: '智能驾驶', weight: 2 },
                { text: '环保', weight: 1 },
                { text: '时尚', weight: 1 },
                { text: '可靠', weight: 1 },
                { text: '省心', weight: 1 },
                { text: '空间大', weight: 1 }
            ];
        }
        
        // 显示词条详情弹窗
        function showTermDetail(termId) {
            const term = DATA_SOURCE.glossary.find(t => t.id === termId);
            if (!term) return;
            
            const categoryNames = {
                'brand': '🚗 汽车品牌',
                'industry': '🏛️ 行业动态',
                'newcar': '🚘 新车发布',
                'company': '🏢 企业新闻',
                'tech': '🔬 技术趋势',
                'market': '📊 市场热点',
                'report': '📑 行业报告',
                'insurance': '🛡️ 保险行业'
            };
            
            const modal = document.createElement('div');
            modal.style.cssText = 'position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); display: flex; justify-content: center; align-items: center; z-index: 1000;';
            modal.onclick = (e) => { if (e.target === modal) modal.remove(); };
            
            modal.innerHTML = `
                <div style="background: white; border-radius: 16px; padding: 30px; max-width: 600px; max-height: 80vh; overflow-y: auto; position: relative; box-shadow: 0 20px 60px rgba(0,0,0,0.3);">
                    <button onclick="this.parentElement.parentElement.remove()" style="position: absolute; top: 15px; right: 15px; background: none; border: none; font-size: 24px; cursor: pointer; color: #999;">&times;</button>
                    
                    <div style="margin-bottom: 15px;">
                        <span style="display: inline-block; padding: 4px 12px; background: #667eea; color: white; border-radius: 20px; font-size: 12px;">${categoryNames[term.category] || term.categoryName}</span>
                    </div>
                    
                    <h2 style="font-size: 28px; color: #333; margin: 0 0 10px 0; display: flex; align-items: center; gap: 10px;">
                        <span style="font-size: 36px;">${term.icon || '📚'}</span>
                        ${term.term}
                    </h2>
                    
                    ${term.fullName ? `<p style="font-size: 16px; color: #999; margin: 0 0 20px 0; font-style: italic;">${term.fullName}</p>` : ''}
                    
                    <div style="background: #f8f9fa; padding: 20px; border-radius: 12px; margin-bottom: 20px;">
                        <h4 style="margin: 0 0 10px 0; color: #667eea;">📖 定义</h4>
                        <p style="font-size: 15px; line-height: 1.8; color: #444; margin: 0;">${term.definition}</p>
                    </div>
                    
                    ${term.aliases && term.aliases.length > 0 ? `
                        <div style="margin-bottom: 20px;">
                            <h4 style="margin: 0 0 10px 0; color: #667eea;">🏷️ 别名</h4>
                            <div style="display: flex; flex-wrap: wrap; gap: 8px;">
                                ${term.aliases.map(alias => `<span style="padding: 4px 12px; background: #e3f2fd; border-radius: 15px; font-size: 13px; color: #1976d2;">${alias}</span>`).join('')}
                            </div>
                        </div>
                    ` : ''}
                    
                    ${term.relatedTerms && term.relatedTerms.length > 0 ? `
                        <div style="margin-bottom: 20px;">
                            <h4 style="margin: 0 0 10px 0; color: #667eea;">🔗 相关词条</h4>
                            <div style="display: flex; flex-wrap: wrap; gap: 8px;">
                                ${term.relatedTerms.map(related => `<span style="padding: 4px 12px; background: #f0f4ff; border-radius: 15px; font-size: 13px; color: #667eea; border: 1px solid #e0e7ff;">${related}</span>`).join('')}
                            </div>
                        </div>
                    ` : ''}
                    
                    ${term.usage ? `
                        <div style="background: #e8f5e9; padding: 15px; border-radius: 12px; border-left: 4px solid #4caf50; margin-bottom: 20px;">
                            <h4 style="margin: 0 0 8px 0; color: #4caf50;">💡 应用示例</h4>
                            <p style="font-size: 14px; color: #555; margin: 0;">${term.usage}</p>
                        </div>
                    ` : ''}
                    
                    <div style="text-align: right; color: #999; font-size: 12px;">
                        来源: ${term.source || '车讯通整理'} | 更新: ${term.updateDate}
                    </div>
                </div>
            `;
            
            document.body.appendChild(modal);
        }
        
        // 筛选词条
        function filterGlossary(category) {
            currentGlossaryFilter = category;
            const glossary = DATA_SOURCE.glossary || [];
            const filtered = category === 'all' ? glossary : glossary.filter(term => term.category === category);
            document.getElementById('glossaryContent').innerHTML = renderGlossaryTerms(filtered, currentGlossaryView);
        }
        
        async function generateReport() {
            const btn = document.querySelector('button[onclick="generateReport()"]');
            const originalText = btn.innerHTML;
            btn.innerHTML = '📄 生成中...';
            btn.disabled = true;
            
            try {
                const { jsPDF } = window.jspdf;
                const doc = new jsPDF('p', 'mm', 'a4');
                
                // 封面
                doc.setFillColor(102, 126, 234);
                doc.rect(0, 0, 210, 297, 'F');
                
                doc.setTextColor(255, 255, 255);
                doc.setFontSize(32);
                doc.text('CHEXUNTONG', 105, 80, { align: 'center' });
                doc.setFontSize(24);
                doc.text('Automotive Weekly Report', 105, 100, { align: 'center' });
                
                doc.setFontSize(14);
                doc.text(`Report Date: ${DATA_SOURCE.lastUpdate}`, 105, 140, { align: 'center' });
                doc.text(`${DATA_SOURCE.news.length} Industry News`, 105, 155, { align: 'center' });
                
                doc.save(`Chexuntong-Automotive-Weekly-${DATA_SOURCE.lastUpdate}.pdf`);
                
            } catch (error) {
                console.error('PDF generation failed:', error);
                alert('PDF生成失败，请重试');
            } finally {
                btn.innerHTML = originalText;
                btn.disabled = false;
            }
        }
        
        function viewHistory() {
            alert('历史记录功能开发中...');
        }
        
        // 页面加载时初始化
        window.onload = init;
    </script>
</body>
</html>

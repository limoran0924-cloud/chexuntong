<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>三界博弈录 | 首页</title>
    <link rel="stylesheet" href="./assets/styles.css" />
  </head>
  <body data-page="home">
    <main class="shell">
      <header class="topbar">
        <div class="brand">
          <div class="brand-badge">三界</div>
          <div class="brand-copy">
            <h2 data-product-name></h2>
            <p>统一收录汽车、快消、央国企三大行业的周度动态资料</p>
          </div>
        </div>
        <div class="actions">
          <a class="ghost-button" href="./login.html">访问说明 / 登录</a>
          <a class="ghost-button" href="./history.html">更新与历史</a>
          <a class="button" href="./automotive.html">快速进入汽车板块</a>
          <button class="button" id="logout-btn" type="button">退出访问</button>
        </div>
      </header>

      <section class="card hero">
        <div class="hero-grid">
          <div class="hero-copy">
            <h2>一个首页，看懂三大板块的品牌、平台与热点波动。</h2>
            <p>
              第一版采用动态前端数据驱动方式，已经支持首页总览、行业独立页面、多条件精准检索、品牌事件热度观察、双词云展示与周期趋势图，同时适合每周一持续更新并保留全年历史资料。
            </p>
            <div class="chip-row" id="overview-chips"></div>
          </div>
          <div class="hero-side">
            <div class="mini-stat">
              <span>当前资料总量</span>
              <strong id="total-records">0</strong>
            </div>
            <div class="mini-stat">
              <span>已覆盖品牌池</span>
              <strong id="total-brands">0</strong>
            </div>
            <div class="mini-stat">
              <span>数据更新时间</span>
              <strong id="last-update">-</strong>
            </div>
          </div>
        </div>
      </section>

      <section class="section">
        <div class="section-head">
          <div>
            <h3>三大板块总览</h3>
            <p>点击任意行业卡片，即可进入对应的动态资料页面。</p>
          </div>
        </div>
        <div class="grid-3" id="industry-grid"></div>
      </section>
    </main>
    <script src="./assets/data.js"></script>
    <script src="./assets/app.js"></script>
  </body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>车讯通 - 汽车行业周报</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container { max-width: 1200px; margin: 0 auto; }
        
        header {
            text-align: center;
            color: white;
            padding: 40px 0;
        }
        
        header h1 {
            font-size: 48px;
            font-weight: 700;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }
        
        header p { font-size: 18px; opacity: 0.9; }
        
        .update-time {
            background: rgba(255,255,255,0.2);
            display: inline-block;
            padding: 8px 20px;
            border-radius: 20px;
            margin-top: 15px;
            font-size: 14px;
        }
        
        .actions {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin: 30px 0;
            flex-wrap: wrap;
        }
        
        .btn {
            padding: 12px 30px;
            border: none;
            border-radius: 25px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 500;
        }
        
        .btn-primary {
            background: #ff6b6b;
            color: white;
        }
        
        .btn-primary:hover {
            background: #ff5252;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255,107,107,0.4);
        }
        
        .btn-secondary {
            background: rgba(255,255,255,0.9);
            color: #667eea;
        }
        
        .btn-secondary:hover {
            background: white;
            transform: translateY(-2px);
        }
        
        .section-title {
            color: white;
            text-align: center;
            font-size: 18px;
            margin: 20px 0 10px;
            opacity: 0.9;
        }
        
        .tabs {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        
        .tab {
            padding: 10px 20px;
            background: rgba(255,255,255,0.2);
            color: white;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 13px;
        }
        
        .tab:hover, .tab.active {
            background: white;
            color: #667eea;
        }
        
        .content-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 20px;
        }
        
        .news-card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            transition: transform 0.3s, box-shadow 0.3s;
            position: relative;
            overflow: hidden;
        }
        
        .news-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(0,0,0,0.15);
        }
        
        .news-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 5px;
            height: 100%;
        }
        
        .news-card.industry::before { background: #3498db; }
        .news-card.newcar::before { background: #e74c3c; }
        .news-card.company::before { background: #f39c12; }
        .news-card.tech::before { background: #9b59b6; }
        .news-card.market::before { background: #1abc9c; }
        .news-card.marketing::before { background: #e74c3c; }
        .news-card.influencer::before { background: #9b59b6; }
        .news-card.media::before { background: #f39c12; }
        .news-card.social::before { background: #1abc9c; }
        .news-card.competitor::before { background: #3498db; }
        .news-card.calendar::before { background: #e74c3c; }
        
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 15px;
        }
        
        .category-tag {
            padding: 5px 12px;
            border-radius: 15px;
            font-size: 12px;
            font-weight: 500;
        }
        
        .category-tag.industry { background: #ebf5fb; color: #3498db; }
        .category-tag.newcar { background: #fdedec; color: #e74c3c; }
        .category-tag.company { background: #fef5e7; color: #f39c12; }
        .category-tag.tech { background: #f5eef8; color: #9b59b6; }
        .category-tag.market { background: #e8f8f5; color: #1abc9c; }
        .category-tag.marketing { background: #fdedec; color: #e74c3c; }
        .category-tag.influencer { background: #f5eef8; color: #9b59b6; }
        .category-tag.media { background: #fef5e7; color: #f39c12; }
        .category-tag.social { background: #e8f8f5; color: #1abc9c; }
        .category-tag.competitor { background: #ebf5fb; color: #3498db; }
        .category-tag.calendar { background: #fdedec; color: #e74c3c; }
        
        .date {
            font-size: 12px;
            color: #95a5a6;
        }
        
        .news-title {
            font-size: 18px;
            font-weight: 600;
            color: #2c3e50;
            margin-bottom: 10px;
            line-height: 1.4;
        }
        
        .news-summary {
            font-size: 14px;
            color: #7f8c8d;
            line-height: 1.6;
            margin-bottom: 15px;
        }
        
        .news-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .source {
            font-size: 12px;
            color: #95a5a6;
        }
        
        .read-more {
            color: #667eea;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        
        .read-more:hover { color: #764ba2; }
        
        .loading {
            text-align: center;
            padding: 60px;
            color: white;
        }
        
        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(255,255,255,0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        
        @keyframes spin { to { transform: rotate(360deg); } }
        
        .empty-state {
            text-align: center;
            padding: 80px 20px;
            color: white;
        }
        
        footer {
            text-align: center;
            padding: 40px;
            color: rgba(255,255,255,0.7);
            font-size: 14px;
        }
        
        .stats {
            display: flex;
            justify-content: center;
            gap: 40px;
            margin: 30px 0;
            flex-wrap: wrap;
        }
        
        .stat-item {
            text-align: center;
            color: white;
        }
        
        .stat-number {
            font-size: 36px;
            font-weight: 700;
        }
        
        .stat-label {
            font-size: 14px;
            opacity: 0.8;
        }
        
        @media (max-width: 768px) {
            header h1 { font-size: 32px; }
            .content-grid { grid-template-columns: 1fr; }
            .actions { flex-direction: column; align-items: center; }
            .btn { width: 200px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🚗 车讯通</h1>
            <p>汽车行业资讯 + 媒介策略资源库</p>
            <div class="update-time">📅 数据更新于：<span id="updateTime">加载中...</span></div>
        </header>
        
        <div class="stats">
            <div class="stat-item">
                <div class="stat-number" id="totalNews">0</div>
                <div class="stat-label">汽车资讯</div>
            </div>
            <div class="stat-item">
                <div class="stat-number">5+6</div>
                <div class="stat-label">资讯+媒介模块</div>
            </div>
            <div class="stat-item">
                <div class="stat-number" id="sourceCount">0</div>
                <div class="stat-label">权威来源</div>
            </div>
        </div>
        
        <div class="actions">
            <button class="btn btn-primary" onclick="refreshData()">🔄 刷新数据</button>
            <button class="btn btn-secondary" onclick="generateReport()">📄 生成周报</button>
            <button class="btn btn-secondary" onclick="viewHistory()">📚 历史记录</button>
        </div>
        
        <!-- 原有资讯分类 -->
        <div class="section-title">📰 汽车资讯</div>
        <div class="tabs">
            <div class="tab active" onclick="filterCategory('all')">全部</div>
            <div class="tab" onclick="filterCategory('industry')">🏛️ 行业动态</div>
            <div class="tab" onclick="filterCategory('newcar')">🚘 新车发布</div>
            <div class="tab" onclick="filterCategory('company')">🏢 企业新闻</div>
            <div class="tab" onclick="filterCategory('tech')">🔬 技术趋势</div>
            <div class="tab" onclick="filterCategory('market')">📊 市场热点</div>
        </div>
        
        <!-- 新增媒介策略模块 -->
        <div class="section-title">🎯 媒介策略资源</div>
        <div class="tabs">
            <div class="tab" onclick="filterCategory('marketing')">📊 营销案例</div>
            <div class="tab" onclick="filterCategory('influencer')">🎤 KOL资源</div>
            <div class="tab" onclick="filterCategory('media')">📺 投放数据</div>
            <div class="tab" onclick="filterCategory('social')">📱 社媒声量</div>
            <div class="tab" onclick="filterCategory('competitor')">⚔️ 竞品分析</div>
            <div class="tab" onclick="filterCategory('calendar')">📅 营销日历</div>
        </div>
        
        <div id="contentArea">
            <div class="loading">
                <div class="loading-spinner"></div>
                <p>正在加载最新汽车资讯...</p>
            </div>
        </div>
        
        <footer>
            <p>车讯通 · 每周一自动更新 · 数据来源：汽车之家/易车/懂车帝/盖世汽车等权威平台</p>
            <p>© 2026 车讯通 Automotive Weekly Report</p>
        </footer>
    </div>
    
    <script src="data.js"></script>
    <script>
        let currentData = [];
        let currentFilter = 'all';
        
        function init() {
            document.getElementById('updateTime').textContent = DATA_SOURCE.lastUpdate;
            loadData();
        }
        
        function loadData() {
            setTimeout(() => {
                currentData = DATA_SOURCE.news;
                renderNews(currentData);
                updateStats();
            }, 500);
        }
        
        function renderNews(data) {
            const contentArea = document.getElementById('contentArea');
            
            if (data.length === 0) {
                contentArea.innerHTML = '<div class="empty-state"><h3>暂无数据</h3></div>';
                return;
            }
            
            const html = `
                <div class="content-grid">
                    ${data.map(item => `
                        <div class="news-card ${item.category}">
                            <div class="card-header">
                                <span class="category-tag ${item.category}">${item.categoryName}</span>
                                <span class="date">${item.date}</span>
                            </div>
                            <h3 class="news-title">${item.title}</h3>
                            <p class="news-summary">${item.summary}</p>
                            <div class="news-footer">
                                <span class="source">来源：${item.source}</span>
                                <a href="${item.url}" target="_blank" class="read-more">查看原文 →</a>
                            </div>
                        </div>
                    `).join('')}
                </div>
            `;
            contentArea.innerHTML = html;
        }
        
        function renderMarketing() {
            const contentArea = document.getElementById('contentArea');
            const cases = DATA_SOURCE.marketing ? DATA_SOURCE.marketing.cases : [];
            
            const html = `
                <div class="content-grid">
                    ${cases.map(item => `
                        <div class="news-card marketing">
                            <div class="card-header">
                                <span class="category-tag marketing">${item.type}</span>
                                <span class="date">${item.period}</span>
                            </div>
                            <h3 class="news-title">${item.brand} - ${item.campaign}</h3>
                            <p class="news-summary">${item.summary}</p>
                            <div class="news-footer">
                                <span class="source">效果：${item.effect}</span>
                                <a href="${item.url}" target="_blank" class="read-more">查看详情 →</a>
                            </div>
                        </div>
                    `).join('')}
                </div>
            `;
            contentArea.innerHTML = html;
        }
        
        function renderInfluencer() {
            const contentArea = document.getElementById('contentArea');
            const list = DATA_SOURCE.influencer ? DATA_SOURCE.influencer.list : [];
            
            const html = `
                <div class="content-grid">
                    ${list.map(item => `
                        <div class="news-card influencer">
                            <div class="card-header">
                                <span class="category-tag influencer">${item.tier === 'top' ? '头部达人' : '腰部达人'}</span>
                                <span class="date">${item.followers}</span>
                            </div>
                            <h3 class="news-title">${item.name}</h3>
                            <p class="news-summary">
                                <strong>平台：</strong>${item.platform}<br>
                                <strong>擅长：</strong>${item.specialty}<br>
                                <strong>合作：</strong>${item.brands.join('、')}
                            </p>
                            <div class="news-footer">
                                <span class="source">报价：${item.avgPrice}</span>
                                <a href="${item.url}" target="_blank" class="read-more">查看主页 →</a>
                            </div>
                        </div>
                    `).join('')}
                </div>
            `;
            contentArea.innerHTML = html;
        }
        
        function renderMedia() {
            const contentArea = document.getElementById('contentArea');
            const platforms = DATA_SOURCE.media ? DATA_SOURCE.media.platforms : [];
            
            const html = `
                <div class="content-grid">
                    ${platforms.map(item => `
                        <div class="news-card media">
                            <div class="card-header">
                                <span class="category-tag media">${item.type}</span>
                                <span class="date">${item.name}</span>
                            </div>
                            <h3 class="news-title">${item.name}</h3>
                            <p class="news-summary">
                                <strong>月均投放：</strong>${item.avgSpend}<br>
                                <strong>优势：</strong>${item.advantage}<br>
                                <strong>趋势：</strong>${item.trend}
                            </p>
                            <div class="news-footer">
                                <span class="source">品牌数：${item.autoBrands}</span>
                            </div>
                        </div>
                    `).join('')}
                </div>
            `;
            contentArea.innerHTML = html;
        }
        
        function renderSocial() {
            const contentArea = document.getElementById('contentArea');
            const ranking = DATA_SOURCE.social ? DATA_SOURCE.social.brandRanking : [];
            
            const html = `
                <div class="content-grid">
                    ${ranking.map((item, index) => `
                        <div class="news-card social">
                            <div class="card-header">
                                <span class="category-tag social">TOP ${index + 1}</span>
                                <span class="date">${item.growth}</span>
                            </div>
                            <h3 class="news-title">${item.brand}</h3>
                            <p class="news-summary">
                                <strong>声量指数：</strong>${item.mentionIndex}<br>
                                <strong>热点话题：</strong>${item.hotTopics.join('、')}
                            </p>
                            <div class="news-footer">
                                <span class="source">社媒声量监测</span>
                            </div>
                        </div>
                    `).join('')}
                </div>
            `;
            contentArea.innerHTML = html;
        }
        
        function renderCompetitor() {
            const contentArea = document.getElementById('contentArea');
            const list = DATA_SOURCE.competitor ? DATA_SOURCE.competitor.comparison : [];
            
            const html = `
                <div class="content-grid">
                    ${list.map(item => `
                        <div class="news-card competitor">
                            <div class="card-header">
                                <span class="category-tag competitor">竞品</span>
                                <span class="date">${item.budgetLevel}</span>
                            </div>
                            <h3 class="news-title">${item.brand}</h3>
                            <p class="news-summary">
                                <strong>定位：</strong>${item.positioning}<br>
                                <strong>核心信息：</strong>${item.keyMessage}<br>
                                <strong>差异化：</strong>${item.differentiation}
                            </p>
                            <div class="news-footer">
                                <span class="source">${item.mainPlatforms.join('、')}</span>
                            </div>
                        </div>
                    `).join('')}
                </div>
            `;
            contentArea.innerHTML = html;
        }
        
        function renderCalendar() {
            const contentArea = document.getElementById('contentArea');
            const shows = DATA_SOURCE.calendar ? DATA_SOURCE.calendar.autoShows : [];
            
            const html = `
                <div class="content-grid">
                    ${shows.map(item => `
                        <div class="news-card calendar">
                            <div class="card-header">
                                <span class="category-tag calendar">A级车展</span>
                                <span class="date">${item.date}</span>
                            </div>
                            <h3 class="news-title">${item.name}</h3>
                            <p class="news-summary">
                                <strong>地点：</strong>${item.venue}<br>
                                <strong>亮点：</strong>${item.highlights.join('、')}
                            </p>
                            <div class="news-footer">
                                <span class="source">营销节点日历</span>
                                <a href="${item.url}" target="_blank" class="read-more">官网 →</a>
                            </div>
                        </div>
                    `).join('')}
                </div>
            `;
            contentArea.innerHTML = html;
        }
        
        function updateStats() {
            document.getElementById('totalNews').textContent = currentData.length;
            const sources = new Set(currentData.map(item => item.source));
            document.getElementById('sourceCount').textContent = sources.size;
        }
        
        function filterCategory(category) {
            currentFilter = category;
            
            document.querySelectorAll('.tab').forEach(tab => {
                tab.classList.remove('active');
            });
            event.target.classList.add('active');
            
            if (category === 'all') {
                renderNews(currentData);
            } else if (['industry', 'newcar', 'company', 'tech', 'market'].includes(category)) {
                const filtered = currentData.filter(item => item.category === category);
                renderNews(filtered);
            } else if (category === 'marketing') {
                renderMarketing();
            } else if (category === 'influencer') {
                renderInfluencer();
            } else if (category === 'media') {
                renderMedia();
            } else if (category === 'social') {
                renderSocial();
            } else if (category === 'competitor') {
                renderCompetitor();
            } else if (category === 'calendar') {
                renderCalendar();
            }
        }
        
        function refreshData() {
            document.getElementById('contentArea').innerHTML = `
                <div class="loading"><div class="loading-spinner"></div><p>正在刷新数据...</p></div>
            `;
            setTimeout(() => {
                loadData();
            }, 1000);
        }
        
        function generateReport() {
            alert('生成周报功能开发中...\n将导出PDF格式报告');
        }
        
        function viewHistory() {
            alert('历史记录功能开发中...');
        }
        
        window.onload = init;
    </script>
</body>
</html>
